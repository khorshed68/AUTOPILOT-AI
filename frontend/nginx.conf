server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    location /api/ {
        # Resolve at request time so restarting the backend doesn't leave a stale IP.
        resolver 127.0.0.11 valid=10s;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Overwrites any client-supplied value, so rate limits can't be dodged by spoofing it.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        # Chat responses are streamed as server-sent events.
        proxy_buffering off;
        proxy_read_timeout 330s;
    }

    # nginx drops inherited add_header directives in any location that sets its own,
    # so each location includes the security headers explicitly.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
